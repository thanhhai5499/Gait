name: gait

services:

  # ─────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: gait_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: GaitDB
      POSTGRES_USER: gait_user
      POSTGRES_PASSWORD: "050499"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gait_user -d GaitDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────
  # React Frontend (Nginx)
  # Proxy /api/* và /ws/* → BE chạy local port 8000
  # ─────────────────────────────
  fe:
    build:
      context: ./FE
      dockerfile: Dockerfile
    image: gait_fe:latest
    container_name: gait_fe
    restart: unless-stopped
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─────────────────────────────
  # pgAdmin — quản lý DB qua trình duyệt
  # ─────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gait_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gait.com
      PGADMIN_DEFAULT_PASSWORD: "050499"
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
    name: gait_postgres_data
